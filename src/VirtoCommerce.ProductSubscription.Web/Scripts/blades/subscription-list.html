<div class="bc blade-static">
    <div class="form-group">
        <div class="blade-search-panel">
            <div class="form-input __search">
                <input placeholder="{{'product-subscription.placeholders.search-subscriptions' | translate}}" ng-model="filter.keyword" ng-keyup="$event.which === 13 && filter.criteriaChanged()">
                <button class="btn __other">
                    <i class="btn-ico fa fa-remove" title="Clear" ng-click="filter.keyword=null;filter.criteriaChanged()"></i>
                </button>
            </div>
            <div class="form-input">
                <select class="form-control" ng-model="filter.status" ng-change="filter.criteriaChanged()" ng-options="s as s for s in labels.subscriptionStatuses">
                    <option value="">{{ 'product-subscription.labels.all-statuses' | translate }}</option>
                </select>
            </div>
        </div>
    </div>
</div>
<div class="blade-static __bottom" ng-if="pageSettings.itemsPerPageCount < pageSettings.totalItems" ng-include="'pagerTemplate.html'"></div>
<div class="blade-content __medium-wide">
    <div class="blade-inner">
        <div class="inner-block" ng-init="setGridOptions({
                    useExternalSorting: true,
                    rowTemplate: 'ps-subscription-list.row.html',
                    columnDefs: [
                        { name: 'number', displayName: 'product-subscription.labels.number', width: 150 },
                        { name: 'status', displayName: 'product-subscription.labels.status', width: 120, cellTemplate: 'ps-status.cell.html' },
                        { name: 'productName', displayName: 'product-subscription.labels.product' },
                        { name: 'quantity', displayName: 'product-subscription.labels.qty', width: 55 },
                        { name: 'intervalCount', displayName: 'product-subscription.labels.frequency', width: 130, enableSorting: false, cellTemplate: 'ps-interval.cell.html' },
                        { name: 'customerName', displayName: 'product-subscription.labels.customer' },
                        { name: 'nextOrderDate', displayName: 'product-subscription.labels.next-order', width: 110, cellFilter: 'date', sort: { direction: uiGridConstants.ASC } }
                    ]})">
            <div class="table-wrapper" ng-if="blade.currentEntities.length">
                <div ui-grid="gridOptions" ui-grid-auto-resize ui-grid-save-state ui-grid-resize-columns ui-grid-move-columns ui-grid-height></div>
            </div>
            <div class="note" ng-if="!blade.currentEntities.length">{{ 'product-subscription.blades.subscription-list.empty' | translate }}</div>
        </div>
    </div>
</div>

<script type="text/ng-template" id="ps-subscription-list.row.html">
    <div ng-click="grid.appScope.openDetailsBlade(row.entity)" ng-repeat="(colRenderIndex, col) in colContainer.renderedColumns track by col.uid" class="ui-grid-cell" ng-class="{'__selected': row.entity.id === grid.appScope.selectedNodeId}" ui-grid-cell></div>
</script>
<script type="text/ng-template" id="ps-status.cell.html">
    <div class="ui-grid-cell-contents"><span class="{{ grid.appScope.labels.statusClass(row.entity.status || row.entity.state) }}">{{ row.entity.status || row.entity.state }}</span></div>
</script>
<script type="text/ng-template" id="ps-interval.cell.html">
    <div class="ui-grid-cell-contents">{{ grid.appScope.labels.interval(row.entity.intervalUnit, row.entity.intervalCount) }}</div>
</script>
